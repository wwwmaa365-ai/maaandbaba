    <script>
      (function () {
        var OrigWebSocket = window.WebSocket;
        if (!OrigWebSocket) return;
        function ViteSafeWebSocket(url, protocols) {
          var urlStr = String(url || '');
          var protoStr = String(protocols || '');
          if (
            protoStr.indexOf('vite') !== -1 ||
            urlStr.indexOf('vite') !== -1 ||
            urlStr.indexOf('token=') !== -1 ||
            urlStr.indexOf(':24678') !== -1
          ) {
            var dummy = new EventTarget();
            dummy.url = urlStr;
            dummy.readyState = 1;
            dummy.protocol = protoStr;
            dummy.extensions = '';
            dummy.bufferedAmount = 0;
            dummy.binaryType = 'blob';
            dummy.send = function () {};
            dummy.close = function () {
              dummy.readyState = 3;
            };
            dummy.onopen = null;
            dummy.onmessage = null;
            dummy.onerror = null;
            dummy.onclose = null;
            return dummy;
          }
          return protocols !== undefined
            ? new OrigWebSocket(url, protocols)
            : new OrigWebSocket(url);
        }
        ViteSafeWebSocket.prototype = OrigWebSocket.prototype;
        ViteSafeWebSocket.CONNECTING = 0;
        ViteSafeWebSocket.OPEN = 1;
        ViteSafeWebSocket.CLOSING = 2;
        ViteSafeWebSocket.CLOSED = 3;
        window.WebSocket = ViteSafeWebSocket;
      })();
    </script>
